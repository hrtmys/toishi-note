name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Scan for known security vulnerabilities in npm packages used
        run: yarn audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips node-gyp

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # db:test:prepare pulls in jsbundling-rails' javascript:build (the
      # JS bundle system tests exercise) as a Rake prerequisite, so this
      # needs Node even though the job is otherwise Ruby-only. Pinned to
      # .node-version so this doesn't quietly drift from whatever Node
      # ubuntu-latest happens to preinstall — see
      # docs/engineering/dev-environment.md's note that the devcontainer
      # already pins the same file.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Run tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test

      - name: Verify db/seeds.rb still runs cleanly
        env:
          RAILS_ENV: test
        run: bin/rails db:seed:replant

  system-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips node-gyp

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Run System Tests
        env:
          RAILS_ENV: test
          CI: true
          # This runner reports 2 CPUs; running system tests at that
          # default parallelism was intermittently timing out an
          # unrelated test almost every run (see
          # docs/engineering/dev-environment.md and test/test_helper.rb).
          # Sequential removes the worst-case contention (multiple
          # parallel workers each running a Puma server + headless
          # Chrome at once). Combined with the per-test retry that
          # CI=true enables in test_helper.rb (retrying just the one
          # affected test in place, rather than requiring all 104 tests
          # to pass simultaneously in a single attempt), this is the
          # fix — see dev-environment.md for what didn't work on its own
          # before this.
          PARALLEL_WORKERS: 1
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
